{% extends "base.html" %}

{% block title %}Register | Expense Tracker{% endblock %}

{% block content %}
<section class="auth-view row justify-content-center align-items-center min-vh-75">
    <div class="col-sm-10 col-md-7 col-lg-5">
        <div class="card app-card auth-card">
            <div class="card-body p-4 p-md-5">
                <span class="auth-icon"><svg class="icon"><use href="#icon-user"></use></svg></span>
                <h1 class="h3 fw-bold mb-2">Register</h1>
                <p class="text-secondary mb-4">Create your account and start organizing your money.</p>
                <form method="post" class="vstack gap-3">
                    <div>
                        <label class="form-label fw-semibold">Username</label>
                        <input class="form-control" type="text" name="username" required autocomplete="username">
                    </div>
                    <div>
                        <label class="form-label fw-semibold">Password</label>
                        <input class="form-control" type="password" name="password" minlength="6" required autocomplete="new-password">
                    </div>
                    <div>
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <input class="form-control" type="password" name="confirm_password" minlength="6" required autocomplete="new-password">
                    </div>
                    <button class="btn btn-primary w-100" type="submit"><svg class="icon"><use href="#icon-user"></use></svg>Register</button>
                </form>
                <p class="text-secondary mt-4 mb-0">Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
